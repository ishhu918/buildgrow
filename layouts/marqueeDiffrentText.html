<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Marquee Animation</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
}

/* container */
.marquee{
  overflow: hidden;
  width: 100%;
  background: #f5f5f5;
}

/* moving track */
.track{
  display: flex;
  width: max-content;
  animation: scroll 12s linear infinite;
}

/* text items */
.track span{
  padding: 15px 40px;
  white-space: nowrap;
  font-size: 22px;
}

/* animation */
@keyframes scroll{
  from{
    transform: translateX(0);
  }
  to{
    transform: translateX(-50%);
  }
}

/* hover pause (optional) */
.marquee:hover .track{
  animation-play-state: paused;
}
</style>

</head>
<body>

<div class="marquee">
  <div class="track">
    <!-- original content -->
    <span>HTML</span>
    <span>CSS</span>
    <span>JavaScript</span>
    <span>React</span>
    <span>Node</span>

    <!-- duplicate content -->
    <span>HTML</span>
    <span>CSS</span>
    <span>JavaScript</span>
    <span>React</span>
    <span>Node</span>
  </div>
</div>

</body>
</html>
