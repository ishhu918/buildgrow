<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web Page</title>
  <!-- inter font   -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <!-- remix icon  -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
  <!-- stylesheet  -->
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>

  <!-- ===== HEADER START ===== -->
  <header class="ishh-container-fluid ishh-header ishh-p-md">
    <div class="ishh-wrapper ishh-container ishh-flex ishh-justify-between ishh-items-center">

      <!-- logo -->
      <div class="ishh-header__logo ishh-flex ishh-gap-lg">
        <a href="/" class="ishh-header__logo-link">
          <img src="./assets/images/logo.svg" alt="Logo" class="ishh-header__logo-img">
        </a>
        <span class="ishh-highlighted-text ishh-p-xs">We are hiring!</span>
      </div>


      <!-- nav -->
      <nav class="ishh-header__nav">
        <ul class="ishh-header__menu ishh-flex ishh-gap-2xl">

          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link  ishh-menu__link--active">Work</a>
          </li>

          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link">Services</a>
          </li>

          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link">About</a>
          </li>

          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link">Blog</a>
          </li>

          <li class="ishh-menu__item ishh-menu__has-children">
            <a href="#" class="ishh-menu__link ">Pages <i class="ri-arrow-drop-down-line"></i>

              
            </a>
            <ul class="ishh-menu__list ishh-dropdown__menu">
                <li class="ishh-menu__item ">
                  <a href="#" class="ishh-menu__link">Page 1
                  </a>
                </li>
                <li class="ishh-menu__item">
                  <a href="#" class="ishh-menu__link">Page 2
                  </a>
                </li>
                <li class="ishh-menu__item">
                  <a href="#" class="ishh-menu__link">Page 3
                  </a>
                </li>
              </ul>
          </li>
          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link">Cart</a>
          </li>
          <li class="ishh-menu__item">
            <a href="#" class="ishh-menu__link">Get in Touch</a>
          </li>

        </ul>
      </nav>
    </div>

  </header>
  <!-- ===== HEADER END ===== -->


  <!-- ===== MAIN CONTENT START ===== -->
  <main class="ishh-main">

    <!-- Hero Section -->
    <section class="ishh-hero">
      <h3 class="ishh-hero__subheading">Subheading</h3>
      <h2 class="ishh-hero__heading">Heading</h2>
      <p class="ishh-hero__text">Text</p>
    </section>

    <!-- About Section -->
    <section class="ishh-about">
      <p class="ishh-about__text">About content here</p>
    </section>

  </main>
  <!-- ===== MAIN CONTENT END ===== -->


  <!-- ===== FOOTER START ===== -->
  <footer class="ishh-footer">
    <p class="ishh-footer__text">
      © 2024-2026 Isha Frames. All rights reserved.
    </p>
  </footer>
  <!-- ===== FOOTER END ===== -->

</body>

</html>
