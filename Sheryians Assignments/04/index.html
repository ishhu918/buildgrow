<!DOCTYPE html>

            <div class="grid__item r1s2-c2">
                <img src="./assets/image.png" alt="">

            <div class="grid__item r1s3-c3">
                <div class="r1s3-c3__flex">
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">

                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">
                        <p>Categories</p>
                    </div>
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">

                    </div>
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">
                        <p>Categories</p>
                    </div>
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">
                        <p>Categories</p>
                    </div>
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">
                        <p>Categories</p>
                    </div>
                    <div class="flex__item">
                        <img src="./assets/image copy 3.png" alt="">
                        <p>Categories</p>
                    </div>

                </div>
            </div>
            <div class="grid__item r1-c4">r1-c4</div>
            <div class="grid__item r2s3-c4">
                <img src="./assets/image copy.png" alt="">
            </div>

            <!-- 2nd row  -->
            <div class="grid__item r3s4-c1">r3s4-c1</div>
            <div class="grid__item r3-c2">r2c3</div>

            <!-- 3rd row  -->
            <div class="grid__item r4-c2">r4-c2</div>
            <div class="grid__item r4-c3s4">r4-c3s4</div>
        </section>
    </main>
    <footer>footer</footer>

</html>
