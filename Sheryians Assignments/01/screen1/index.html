<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Pikachu</title>
  </head>
  <body>
    <header class="container-fluid">
      <img src="../assets/pokemon_logo.png" alt="Logo" class="logo" />
      <div class="menu">
        <div class="menu__bar"></div>
        <div class="menu__bar"></div>
        <div class="menu__bar"></div>
      </div>
    </header>
    <main class="container-fluid">
        <!-- hero section start -->
      <section class="hero">
        <div class="hero__dots">
          <a href="#screen1" class="hero__dots--circle"></a>
          <a href="#screen2" class="hero__dots--circle"></a>
          <a href="#screen3" class="hero__dots--circle"></a>
          <a href="#screen4" class="hero__dots--circle"></a>
        </div>
        <!-- hero content  -->
        <div class="hero__content">
          <div id="screen1" class="hero__content__left">
            <h2 class="hero__content__left--sub-heading">POKEMON GEN I</h2>
            <h1 class="hero__content__left--heading">Pikachu</h1>
            <p class="hero__content__left--text">Pikachu is an Electric-type Pokémon introduced in Generation I. Pikachu are small, chubby, and incredibly cute mouse-like Pokémon. They are almost completely covered by yellow fur.</p>
            <p class="hero__content__left--date">01/08</p>
          </div>
            <div class="hero__content__right">
                <img src="../assets/pikachu.png" alt="Pikachu" class="hero__content__right--img" />
        </div>
      </section>
      <!-- hero section end  -->
    </main>
    <footer class="container-fluid">All Right Reserved</footer>
  </body>
</html>
